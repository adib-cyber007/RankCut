name: macOS smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      RANKCUT_TEST_PORT: "4185"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare macOS tools
        run: |
          chmod +x setup.sh "Start RankCut.command"
          ./setup.sh
      - name: Check JavaScript and shell launchers
        run: |
          bash -n setup.sh
          bash -n "Start RankCut.command"
          node --check server.js
          node --check lib/pinned-https.js
          node --check static/meme/meme.js
          node --check tests/platform-smoke.js
      - name: Run isolated macOS server smoke test
        run: |
          TEST_DATA="$(mktemp -d "$RUNNER_TEMP/rankcut-macos.XXXXXX")"
          export TEST_DATA
          cleanup() {
            if [[ -n "${SERVER_PID:-}" ]]; then kill "$SERVER_PID" 2>/dev/null || true; fi
            rm -rf -- "$TEST_DATA"
          }
          trap cleanup EXIT
          RANKCUT_PORT="$RANKCUT_TEST_PORT" RANKCUT_DATA_DIR="$TEST_DATA" node server.js > "$RUNNER_TEMP/rankcut-server.log" 2>&1 &
          SERVER_PID=$!
          for _attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 2 "http://127.0.0.1:$RANKCUT_TEST_PORT/api/health" >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent --max-time 2 "http://127.0.0.1:$RANKCUT_TEST_PORT/api/health" >/dev/null || { cat "$RUNNER_TEMP/rankcut-server.log"; exit 1; }
          for route in / /ranking /meme; do
            curl --fail --silent --max-time 5 "http://127.0.0.1:$RANKCUT_TEST_PORT$route" >/dev/null
          done
          node -e "fetch('http://127.0.0.1:' + process.env.RANKCUT_TEST_PORT + '/api/health').then(r => r.json()).then(h => { if (!h.ok || !h.tools.ffmpeg || !h.tools.ffprobe || !h.tools.ytdlp) process.exit(1); })"
          RANKCUT_TEST_DATA_DIR="$TEST_DATA" node tests/platform-smoke.js
